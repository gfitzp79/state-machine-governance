name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Platform build and enforcement tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - name: Configure a development environment
        run: |
          cp .env.example .env
          # A real deployment must supply its own. This proves the guard permits
          # the shipped defaults only when ENVIRONMENT is explicitly development.
          echo "ENVIRONMENT=development" >> .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose ps --format '{{.Service}} {{.Status}}' | grep -q '^api.*healthy'; then
              echo "api healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "api did not become healthy"
          docker compose logs api
          exit 1

      - name: The schema came from migrations, not create_all
        run: |
          set -e
          docker compose exec -T api alembic current | grep -q '(head)'             || { echo "database is not at head"; exit 1; }
          # Every append-only table carries its trigger. Autogenerate cannot see
          # triggers, so a migration adding such a table can quietly omit one and
          # leave an invariant (CINV-7, PINV-9, TSE-1) unenforced.
          docker compose exec -T api python -c "
          from app.core.db import engine
          from app.db_init import APPEND_ONLY_TABLES, _verify_immutability_triggers
          with engine.connect() as c:
              _verify_immutability_triggers(c)
          print('append-only triggers verified on', ', '.join(APPEND_ONLY_TABLES))
          "

      - name: Models and migrations agree
        run: |
          # The same drift argument as the invariant catalogue: a model changed
          # without a migration is a schema the history no longer describes.
          docker compose exec -T api alembic check

      - name: A v0.1.0 database upgrades without losing data
        run: |
          # Every suite is teed because "Published counts match the code" runs at
          # the end of this job, where no container is guaranteed, and a test
          # total is a property of a run rather than of the source. pipefail
          # because tee returns its own status, so without it a failing suite
          # would report the build green.
          set -o pipefail
          docker compose exec -T api python upgrade_test.py | tee /tmp/upgrade_test.log
          # That test rebuilds the schema, so restore the seeded database for
          # anything that runs after it.
          docker compose down -v
          docker compose up -d --wait

      - name: Configuration layer tests
        run: |
          set -o pipefail
          docker compose exec -T api python config_test.py | tee /tmp/config_test.log

      - name: Enforcement layer tests
        run: |
          set -o pipefail
          docker compose exec -T api python smoke_test.py | tee /tmp/smoke_test.log

      - name: The UI is served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          test "$code" = "200" || { echo "UI returned $code"; exit 1; }

      - name: The API is reachable through the proxy
        run: curl -fsS http://localhost:8080/api/health

      - name: Security posture the audit established
        run: |
          set -e
          # The full governance model must NOT be anonymously readable: it
          # describes the separation-of-duties design.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/config/governance)
          test "$code" = "403" || { echo "governance config is anonymously readable ($code)"; exit 1; }

          # Machine definitions carry the roles permitted to fire each gate.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/engine/machines)
          test "$code" = "403" || { echo "machine definitions are anonymously readable ($code)"; exit 1; }

          # Branding is the one thing that must stay open, for the sign-in page.
          curl -fsS http://localhost:8080/api/config | grep -q organisation

          # The API must run unprivileged.
          docker compose exec -T api id -u | grep -qv '^0$' || { echo "api runs as root"; exit 1; }

      - name: The boot guard refuses shipped secrets outside development
        run: |
          set -e
          docker compose stop api
          # Production environment, shipped secret: the API must refuse to start.
          if ENVIRONMENT=production docker compose run --rm -T \
               -e ENVIRONMENT=production -e JWT_SECRET=dev-secret-change-me \
               api python -c "import app.main" 2>&1 | tee /tmp/guard.log; then
            echo "the API started with the shipped secret in production"
            exit 1
          fi
          grep -qi "refusing to start" /tmp/guard.log || {
            echo "the failure was not the boot guard:"; cat /tmp/guard.log; exit 1; }
          echo "boot guard refused as expected"
          docker compose start api

      - name: Published counts match the code
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path("platform/backend/app")
          modules = root / "modules"

          def count(pattern, glob):
              return sum(
                  len(re.findall(pattern, p.read_text(encoding="utf-8")))
                  for p in modules.glob(glob)
              )

          machines = count(r"= StateMachine\(", "*/machine.py")
          transitions = count(r"\bTransition\(", "*/machine.py")
          invariants = count(r"\bInvariant\(", "*/invariants.py")
          # Distinct EVENTS, not decorators: an event may carry more than one
          # handler, and "28 cascade events" has to mean 28 things that can
          # happen rather than 30 functions that listen.
          cascades = len(
              set(
                  re.findall(
                      r'@cascades\.on\(\s*"([a-z_.]+)"',
                      (modules / "cascades.py").read_text(encoding="utf-8"),
                  )
              )
          )

          actual = {
              "state machines": machines,
              "gated transitions": transitions,
              "invariants": invariants,
              "cascade events": cascades,
          }
          print("counted:", actual)

          readmes = [pathlib.Path("README.md"), pathlib.Path("platform/README.md")]
          failed = False
          for readme in readmes:
              text = readme.read_text(encoding="utf-8")
              for label, value in actual.items():
                  # Claims are written as "8 state machines", "45 invariants", ...
                  for m in re.finditer(r"\*?\*?(\d+)\*?\*? " + re.escape(label), text):
                      claimed = int(m.group(1))
                      if claimed != value:
                          print(f"{readme}: claims {claimed} {label}, code has {value}")
                          failed = True

          # The four counts above are derived from the source. A test total
          # cannot be: it only exists once a suite has run. So it comes from the
          # runs earlier in this job rather than from a run started here, which
          # for smoke_test.py would mean another full database reset, since it
          # refuses anything but a freshly seeded one.
          suites = {
              "config_test.py": "/tmp/config_test.log",
              "smoke_test.py": "/tmp/smoke_test.log",
              "upgrade_test.py": "/tmp/upgrade_test.log",
          }
          totals = {}
          for script, log in suites.items():
              log_path = pathlib.Path(log)
              if not log_path.exists():
                  print(f"no run captured for {script} at {log}")
                  failed = True
                  continue
              # Both runners end with "passed: N   failed: M". Take the last, so
              # a suite printing the block more than once reports its real total.
              seen = re.findall(
                  r"^passed: (\d+)", log_path.read_text(encoding="utf-8"), re.M
              )
              if not seen:
                  print(f"{log} holds no 'passed: N' line for {script}")
                  failed = True
                  continue
              totals[script] = int(seen[-1])
          print("ran:", totals)

          # A published total is only checkable if we can tell which suite it
          # belongs to, so the rule is that it shares a line with exactly one
          # script name. The drift this catches was "147 tests" in a comment and
          # "126 passed" three lines below, neither attached to a suite and both
          # wrong, which is how the two copies came to disagree unnoticed.
          claim = re.compile(r"\*?\*?(\d+)\*?\*? (?:tests|passed)\b")
          for doc in readmes + [pathlib.Path("CONTRIBUTING.md")]:
              lines = doc.read_text(encoding="utf-8").splitlines()
              for n, line in enumerate(lines, 1):
                  values = [int(m.group(1)) for m in claim.finditer(line)]
                  if not values:
                      continue
                  named = {s for s in suites if s in line}
                  if len(named) != 1:
                      print(
                          f"{doc}:{n}: a test total has to sit on a line naming "
                          f"exactly one of {', '.join(sorted(suites))}, so that "
                          f"CI knows which suite it claims: {line.strip()}"
                      )
                      failed = True
                      continue
                  script = named.pop()
                  for value in values:
                      if script in totals and value != totals[script]:
                          print(
                              f"{doc}:{n}: claims {value} for {script}, "
                              f"the run reports {totals[script]}"
                          )
                          failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build

      - name: The build carries no inline script
        run: python3 ../../tools/check_no_inline_script.py dist/index.html

  hygiene:
    name: Links, secrets and licence headers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every markdown link resolves, anchors included
        run: |
          # Replaces an inline regex that captured the anchor and then threw it
          # away, so a link to a real file and a section that does not exist
          # passed. Two such links were in the repository and both passed.
          python3 tools/check_links.py

      - name: No unfilled placeholders
        run: |
          if grep -rn "<!-- LINK TO" --include="*.md" .; then
            echo "unfilled link placeholder found"
            exit 1
          fi

      - name: No em dashes in the documentation
        run: python3 tools/check_em_dashes.py

      - name: Specification matches the code
        run: |
          # Every invariant registered in code appears in the catalogue with the
          # same enforcement layer, and vice versa. A rule enforced in code and
          # absent from the documents is exactly the drift this project argues
          # against, so it fails the build rather than accumulating quietly.
          python3 tools/check_invariant_drift.py

      - name: Every invariant cites a section that exists
        run: python3 tools/check_spec_references.py

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Licence files present
        run: |
          test -f LICENSE
          test -f platform/LICENSE
          test -f platform/NOTICE
          test -f SECURITY.md
          grep -q "Apache License" platform/LICENSE
          grep -q "Creative Commons" LICENSE
