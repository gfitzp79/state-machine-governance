# ---------------------------------------------------------------------------
# Governance configuration
# ---------------------------------------------------------------------------
#
# This file is the enterprise-facing half of the platform. Everything the
# specification marks [CUSTOMISE] lives here, so aligning the tool to your
# operating model is a configuration change, not a code change.
#
# The values shipped below are the framework's recommended baseline, aligned to
# regulated financial services. Edit them to match your own framework.
#
#   docker compose restart api      # picks up changes to thresholds and lists
#
# WHAT IS NOT CONFIGURABLE, AND WHY
#
# Lifecycle state names, the 1-5 impact and likelihood scales, control
# effectiveness rating names, treatment strategies and the five rating band
# names are fixed. The invariants and the database constraints reference them by
# name: RINV-5 says a Critical risk cannot be accepted, and there is a CHECK
# constraint that enforces exactly that. Renaming them at runtime would break
# the enforcement they exist to provide. Band *boundaries* are configurable;
# band names are not.
#
# ---------------------------------------------------------------------------

organisation:
  # Shown in the UI header and on the sign-in page.
  name: Example Corporation
  short_name: Example
  # Optional: displayed under the organisation name.
  tagline: Governance platform

# ---------------------------------------------------------------------------
# Risk appetite and scoring
# Specification: codified-rules section 1.2, scoring-model section 1
# ---------------------------------------------------------------------------
scoring:
  # Score boundaries for each rating band. Scores run 1-25 (impact x likelihood).
  # The five band names are fixed; move the boundaries to match your appetite.
  # Bands must be contiguous and cover 1-25 with no gaps or overlaps.
  rating_bands:
    - { rating: Critical,     min: 20, max: 25, appetite: Above Appetite }
    - { rating: High,         min: 15, max: 19, appetite: Above Appetite }
    - { rating: Moderate,     min: 10, max: 14, appetite: Above Appetite }
    - { rating: Moderate-Low, min: 5,  max: 9,  appetite: At Appetite }
    - { rating: Low,          min: 1,  max: 4,  appetite: Within Appetite }

  # Re-evaluation cadence in calendar days, by reported rating.
  # Specification: codified-rules section 5.4
  review_cadence_days:
    Critical: 14
    High: 30
    Moderate: 60
    Moderate-Low: 90
    Low: 180

# ---------------------------------------------------------------------------
# Acceptance rules
# Specification: codified-rules section 5.5
#
# `acceptable: false` on a band makes RINV-5 refuse acceptance at that rating.
# The baseline refuses it at Critical only. Setting it false on High as well is
# a legitimate tightening; the invariant picks it up with no code change.
# ---------------------------------------------------------------------------
#   approver      minimum seniority from roles.seniority_ladder that may approve
#                 the acceptance. Enforced against the approver's own seniority.
#                 null on an unacceptable band.
#   max_renewals  how many times an acceptance may be re-assessed and extended
#                 before it must be treated rather than carried again.
acceptance:
  Critical:     { acceptable: false, max_days: 0,   approver: null,     max_renewals: 0 }
  High:         { acceptable: true,  max_days: 90,  approver: C-level,  max_renewals: 1 }
  Moderate:     { acceptable: true,  max_days: 180, approver: VP,       max_renewals: 1 }
  Moderate-Low: { acceptable: true,  max_days: 360, approver: Director, max_renewals: 2 }
  Low:          { acceptable: true,  max_days: 365, approver: Director, max_renewals: 99 }

# ---------------------------------------------------------------------------
# Control effectiveness
# Specification: codified-rules section 4.5-4.6, section 10.2
# ---------------------------------------------------------------------------
control_effectiveness:
  # The ceiling on how far residual likelihood may fall below inherent, per
  # resolved CE rating (LKH-1). Raising these weakens RINV-9; lowering them
  # tightens it. Setting CE-High to 1 means no control can ever buy more than
  # one level of likelihood reduction.
  likelihood_reduction:
    CE-High: 2
    CE-Medium: 1
    CE-Low: 0
    CE-Unvalidated: 0

  # How long evidence stays valid, by the control's test cadence (CE-6 / CINV-10).
  # Expired evidence auto-downgrades to CE-Unvalidated with no manual override.
  expiry_months:
    Continuous: 2
    Monthly: 6
    Quarterly: 12
    Annual: 24

  # Response SLA in business days when a linked control degrades, by risk rating.
  degradation_sla_days:
    Critical: 5
    High: 10
    Moderate: 20
    Moderate-Low: 30
    Low: 30

# ---------------------------------------------------------------------------
# Risk taxonomy
# Specification: codified-rules sections 3.2, 3.7
# ---------------------------------------------------------------------------
risk:
  # NIST RMF organisational tiers. Rename or reduce to match your model; impact
  # is scored within the selected tier's scope boundary (IMP-1).
  #
  # Quote any value containing a comma. In YAML flow mappings (the { } form) an
  # unquoted comma ends the value and starts a new key, which turns a sentence
  # into silent extra nulls rather than an error.
  tiers:
    - { id: Tier_1, label: "Organisation",       description: "Enterprise-wide or cross-functional systemic risk" }
    - { id: Tier_2, label: "Mission/Process",    description: "Business process, mission area, or operational domain" }
    - { id: Tier_3, label: "Information System", description: "Specific system, platform, or application" }
    - { id: Tier_4, label: "Component",          description: "Individual component, service, or interface" }

  # Authoritative intake sources. Items arriving by any other route are triaged
  # into alternate governance rather than the register.
  intake_sources:
    - Assessment
    - Audit_Finding
    - Incident
    - Threat_Intelligence
    - Control_Test_Failure
    - Issue_Promotion
    - Threat_Model
    - Vendor_Assessment
    - Regulatory_Change
    - Self_Identified

# ---------------------------------------------------------------------------
# Control taxonomy
# Specification: codified-rules section 8.3
# ---------------------------------------------------------------------------
controls:
  # Baseline of 16 families. Replace wholesale with your own control framework;
  # nothing else in the platform depends on these names.
  families:
    - Access_Control
    - Asset_Management
    - Application_Security
    - Business_Continuity
    - Cryptography
    - Data_Protection
    - Endpoint_Security
    - Governance
    - Human_Resources
    - Identity_Management
    - Incident_Response
    - Logging_Monitoring
    - Network_Security
    - Physical_Security
    - Third_Party_Risk
    - Vulnerability_Management

  types:
    - Preventive
    - Detective
    - Corrective

  test_frequencies:
    - Continuous
    - Monthly
    - Quarterly
    - Annual

  # Asset criticality tiers used by the asset register and threat model scoping.
  asset_tiers:
    - Tier_1
    - Tier_2
    - Tier_3
    - Tier_4

  # -- objective and activity attributes ------------------------------------
  #
  # A control objective used to carry seven fields, which is not enough to
  # assess one. These are the attributes an assessor actually asks for, and
  # several of them constrain what the control may claim.

  # How the control runs. A manual control cannot hold a CE above the ceiling
  # set below, however good its evidence: the evidence describes the last time
  # a person did it, not what happens on the occasion nobody does.
  automation_levels:
    - Manual
    - Semi_Automated
    - Automated

  # CINV-11. The highest CE a control may hold at each automation level.
  # Raising Manual to CE-High means asserting that a human process is as
  # reliable as an enforced one.
  automation_ce_ceiling:
    Manual: CE-Medium
    Semi_Automated: CE-High
    Automated: CE-High

  # NIST SP 800-53 style. Orthogonal to preventive/detective/corrective.
  implementation_types:
    - Technical
    - Administrative
    - Physical

  # How often the control OPERATES. Distinct from test_frequency, which is how
  # often somebody checks that it did. Conflating the two is why "annually
  # tested" gets read as "annually performed".
  operating_frequencies:
    - Continuous
    - Daily
    - Weekly
    - Monthly
    - Quarterly
    - Semi_Annual
    - Annual
    - Event_Driven

  # Audit evidence hierarchy, weakest first. Asking somebody whether the control
  # works is not the same as watching it work, and neither is the same as
  # performing it yourself against a sample.
  assurance_methods:
    - Inquiry
    - Observation
    - Inspection
    - Re_Performance

  # CINV-12. A key control cannot rest on the weaker methods.
  key_control_minimum_assurance: Inspection

  # What a control activity produces when it runs. Recording the expected type
  # up front is what makes a missing artefact detectable rather than debatable.
  evidence_types:
    - Configuration_Export
    - System_Report
    - Log_Extract
    - Screenshot
    - Attestation
    - Ticket_Record
    - Scan_Result
    - Third_Party_Report
    - Sample_Test

# ---------------------------------------------------------------------------
# Policy governance
# Specification: codified-rules sections 12-15
# ---------------------------------------------------------------------------
policy:
  types:
    - Information_Security
    - Data_Protection
    - Operational_Resilience
    - Third_Party
    - Acceptable_Use
    - AI_Governance

  review_cycles:
    - Annual
    - Biennial

  # Every framework selectable as a compliance mapping on a policy or standard.
  compliance_frameworks:
    - ISO27001
    - SOC2
    - PCI-DSS
    - DORA
    - NIS2
    - NIST-CSF
    - NIST-800-53
    - EU-AI-Act
    - GDPR

  # Frameworks whose audit cadence forces an Annual review cycle (CF-4 / PINV-4).
  # A policy mapped to any of these cannot be set to Biennial.
  annual_audit_frameworks:
    - ISO27001
    - SOC2
    - PCI-DSS
    - DORA
    - NIS2

  exceptions:
    # PE-1: standard maximum exception window, in days.
    max_days: 365
    # PE-1: extended window, available only with CISO approval.
    extended_max_days: 730
    # Active exception count on one policy that triggers an unscheduled review.
    review_trigger_count: 5
    # PE-4: notify the requestor this many days before expiry.
    expiry_warning_days: 30

# ---------------------------------------------------------------------------
# Threat management
# Specification: codified-rules sections 19-20
# ---------------------------------------------------------------------------
threat:
  # TINV-5: maximum window for a local acceptance of a Low severity scenario.
  local_acceptance_max_days: 365
  # TINV-3: severities at or above this cannot be accepted locally and must be
  # promoted to the risk register. Order is Low, Medium, High, Critical.
  minimum_promotable_severity: Medium
  # Days an unaddressed Medium+ scenario may sit before auto-promotion.
  auto_promotion_days: 15

  # -- decomposition attributes --------------------------------------------
  #
  # A component is not just a box on a diagram. What data it handles and where
  # it sits determine what a compromise costs, so both are first-class
  # attributes rather than free text in a description.

  # Ordered least to most sensitive. The order is what TINV-9 and TINV-11 read.
  data_classifications:
    - Public
    - Internal
    - Confidential
    - Restricted

  # Components at or above this classification must sit inside a declared trust
  # zone (TINV-9) and must have at least one threat scenario before the model
  # can be signed off (TINV-11). You decomposed it, so you thought about it.
  sensitive_classification_threshold: Confidential

  # Where a component lives. Ordered least to most trusted; a data flow that
  # crosses zones is where the interesting threats are.
  trust_zones:
    - { id: Public_Internet,    label: "Public internet",     trust: 0 }
    - { id: DMZ,                label: "DMZ / edge",          trust: 1 }
    - { id: Third_Party,        label: "Third-party managed", trust: 1 }
    - { id: Internal_Network,   label: "Internal network",    trust: 2 }
    - { id: Restricted_Enclave, label: "Restricted enclave",  trust: 3 }

  # How reachable the component is. Informs, but never sets, severity.
  exposure_levels:
    - Internet_Facing
    - Partner_Facing
    - Internal_Only
    - Isolated

  # Data categories a component may handle. Drives the regulatory view of what a
  # compromise triggers. Replace with your own data taxonomy.
  data_types:
    - PII
    - Payment_Card
    - Health
    - Credentials
    - Financial_Records
    - Intellectual_Property
    - Operational_Telemetry
    - Public_Content

  # -- environmental context ------------------------------------------------
  #
  # Threat modelling is not performed in isolation, but the existing control
  # posture is INFORMATIVE, never determinative. Identification happens against
  # the architecture as designed, not as currently defended; otherwise a
  # well-controlled system looks threat-free and the record of the threat
  # disappears the moment the control fails.
  #
  # This is the threat-modelling analogue of LKH-3, which scores inherent
  # likelihood with no control adjustment.
  context:
    # Surface the asset's control and risk posture during decomposition and
    # analysis. Setting this false hides the context panel entirely; it never
    # changes how scenarios are identified or scored.
    show_environmental_context: true
    # A deployment whose CE is at or below this is reported as a coverage gap
    # rather than as coverage.
    weak_coverage_at_or_below: CE-Low
    # Control families considered relevant to each STRIDE category. Used only to
    # rank the coverage panel; it never links, mitigates or excludes anything.
    #
    # These names must exist in controls.families above. If you replace your
    # control taxonomy, replace this map with it: a hint pointing at a family
    # that no longer exists ranks nothing, silently, which is worse than no hint
    # at all. The loader refuses to start rather than let that happen.
    stride_control_families:
      Spoofing: [Identity_Management, Access_Control]
      Tampering: [Data_Protection, Cryptography, Application_Security]
      Repudiation: [Logging_Monitoring, Identity_Management]
      Information_Disclosure: [Data_Protection, Cryptography, Access_Control]
      Denial_of_Service: [Network_Security, Business_Continuity]
      Elevation_of_Privilege: [Access_Control, Identity_Management, Vulnerability_Management]

  # How a scenario may relate to an existing risk record. Most threats on a
  # mature system map to risks that already exist; minting a duplicate for each
  # one corrupts the register (TINV-8).
  #
  #   creates_risk      this link type mints a new register entry. Exactly one
  #                     type may do this, and it is the promotion action.
  #   resolves_scenario the register demonstrably carries this exposure, so the
  #                     scenario has reached a permitted end state (TINV-1).
  #                     Whether the record was created now or already existed
  #                     makes no governance difference.
  risk_link_types:
    - { id: Represents,     label: "Is represented by this risk", creates_risk: false, resolves_scenario: true }
    - { id: Contributes_To, label: "Contributes to this risk",    creates_risk: false, resolves_scenario: false }
    - { id: Promoted_From,  label: "Was promoted into this risk", creates_risk: true,  resolves_scenario: true }

# ---------------------------------------------------------------------------
# Roles and separation of duties
# Specification: codified-rules sections 2.1-2.3
#
# `level` orders the roles for checks that need seniority, such as PINV-5
# (policy approval requires CISO or above). Adding a role here makes it
# assignable; referencing it in a transition's role list makes it meaningful.
# ---------------------------------------------------------------------------
roles:
  definitions:
    - { id: Auditor,              level: 0, description: "Read-only assurance access" }
    - { id: Control_Operator,     level: 1, description: "Implements and operates controls" }
    - { id: Control_Owner,        level: 2, description: "Owns control design and effectiveness evidence" }
    - { id: Risk_Treatment_Owner, level: 2, description: "Accountable for treatment delivery" }
    - { id: AppSec_Engineer,      level: 2, description: "Application security engineering" }
    - { id: Risk_Analyst,         level: 3, description: "Assessment, scoring, validation, SLA tracking" }
    - { id: GRC_Engineer,         level: 3, description: "Treatment feasibility, tooling, specification" }
    - { id: Security_SME,         level: 3, description: "Threat landscape and architecture advisory" }
    - { id: System_Owner,         level: 3, description: "Accountable for a system or service" }
    - { id: Policy_Owner,         level: 3, description: "Owns policy content and review cycle" }
    - { id: AppSec_Lead,          level: 4, description: "Application security leadership and sign-off" }
    - { id: Risk_Owner,           level: 4, description: "Owns the risk decision and the residual" }
    - { id: Risk_Stakeholder,     level: 5, description: "Senior oversight and escalation" }
    - { id: CISO,                 level: 6, description: "Policy approval and governance authority" }
    - { id: Admin,                level: 7, description: "Platform administration" }

  # Organisational seniority, ordered lowest to highest. Distinct from functional
  # role: it drives the ownership-by-severity matrix below.
  seniority_ladder:
    - Individual
    - Manager
    - Director
    - Senior_Director
    - VP
    - C-level

  # Minimum seniority to own a risk at each rating.
  # Specification: codified-rules section 2.3
  ownership_by_severity:
    Critical: C-level
    High: VP
    Moderate: Senior_Director
    Moderate-Low: Director
    Low: Director

# ---------------------------------------------------------------------------
# Escalation and SLA windows, in calendar days
# Specification: codified-rules section 6, state-transitions section 8
# ---------------------------------------------------------------------------
escalation:
  # CINV-5: a control in Failure this long without a remediation plan escalates.
  control_failure_escalation_days: 21
  # PINV-7: control alignment confirmation window after a policy revision.
  policy_realignment_days: 30
  # PINV-3: control re-mapping window after a policy deprecation.
  policy_remapping_days: 60
  # Risk re-assessment window after a contributing control is retired.
  control_retirement_reassessment_days: 30

# ---------------------------------------------------------------------------
# Treatment planning
# Specification: codified-rules section 5.2-5.3
# ---------------------------------------------------------------------------
treatment:
  # Level-of-effort bands offered when planning a treatment.
  loe_bands: [XS, S, M, L, XL]

  checkin_frequencies:
    - Weekly
    - Fortnightly
    - Monthly
    - Quarterly

  checkin_statuses:
    - On_Track
    - At_Risk
    - Blocked
    - Delivered

# ---------------------------------------------------------------------------
# Compliance and assurance
# Specification: codified-rules Part 6 (sections 21-24)
#
# The register holds framework REQUIREMENTS as first-class records, because a
# gap cannot be detected without the set to compare against. Before this
# existed, CF-2 had control objectives inherit compliance mappings from the
# policies that referenced them, which cannot answer the only question an
# assessor asks: show me the evidence for this specific clause.
# ---------------------------------------------------------------------------
compliance:
  # How a control objective may relate to a requirement.
  #
  #   satisfies   this link, on its own, can make a requirement Covered
  #   time_bound  this link expires and must be renewed or replaced
  #
  # AINV-3: Partial does not satisfy. Partial coverage of a requirement is a
  # gap with work in progress, exactly as a partially mitigated threat is an
  # open threat (TM-PARTIAL).
  coverage_levels:
    - { id: Full,         label: "Fully satisfies this requirement", satisfies: true,  time_bound: false }
    - { id: Partial,      label: "Partially satisfies",              satisfies: false, time_bound: false }
    - { id: Compensating, label: "Compensating control",             satisfies: true,  time_bound: true }

  # AINV-4: a compensating assertion is never permanent. Same principle as
  # RINV-4 for risk acceptance and TINV-5 for threat acceptance.
  compensating_max_days: 365

  # AINV-2: deployment statuses that count as the control actually running
  # where the requirement applies. A Planned or Failed deployment covers
  # nothing, which is the same filter TINV-4 applies to threat mitigation.
  live_deployment_statuses:
    - Active
    - Degraded

  # Days before a compensating assertion expires that the owner is notified.
  compensating_warning_days: 30

  # Directory holding framework catalogues, bind-mounted alongside this file.
  frameworks_dir: /srv/config/frameworks

  # Catalogues to load at boot. A framework present in the directory but absent
  # here is available to adopt but not yet in scope.
  adopt:
    - NIST-CSF-2.0

  # AINV-6. Frameworks whose content this repository may not redistribute.
  # A catalogue declaring redistributable: false is refused at boot if it
  # carries requirement text, so the licence is enforced rather than described.
  # Load these from your own licensed copy with tools/import_framework.py.
  #
  # This list is a convenience for operators, not legal advice. Verify the
  # current terms of any framework you load.
  licensed_frameworks:
    - ISO-27001-2022
    - ISO-27002-2022
    - CIS-Controls-8.1
    - PCI-DSS-4.0
    - SOC2-TSC
