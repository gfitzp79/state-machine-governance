# ISO/IEC 27001:2022 — framework record only, no requirement content.
#
# This file deliberately ships ZERO requirements.
#
# ISO/IEC 27001:2022 is copyright ISO/IEC and is sold per seat. Its Annex A
# control text, and the wording of its clauses, are not redistributable. This
# repository is public, so it cannot carry them, and `redistributable: false`
# means AINV-6 will refuse this catalogue at boot if requirement text ever
# appears in it. The licence is enforced by the loader rather than described in
# a comment that somebody eventually ignores.
#
# To use ISO 27001 here, load the control set from your own licensed copy:
#
#     python tools/import_framework.py ISO-27001-2022 my-annex-a.csv
#
# The importer writes to the database, never back into this repository, so a
# `git status` after an import stays clean and your licensed content cannot be
# committed by accident.
#
# Nothing in this file is legal advice. Confirm the current terms of your own
# licence before importing.

id: ISO-27001-2022
name: ISO/IEC 27001 Information security management systems
version: "2022"
authority: International Organization for Standardization
redistributable: false
source_url: https://www.iso.org/standard/27001
licence_note: >
  Copyright ISO/IEC. Requirement and Annex A control text may not be
  redistributed. Load from your own licensed copy with
  tools/import_framework.py. Control identifiers such as A.5.15 are used here
  as references only.

# Expected shape after import, for reference:
#
# requirements:
#   - { ref: "A.5.1",  category: "Organizational controls", title: "<from your copy>" }
#   - { ref: "A.8.16", category: "Technological controls",  title: "<from your copy>" }
requirements: []
