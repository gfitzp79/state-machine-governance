# Alembic configuration.
#
# The database URL is deliberately absent. It comes from the application's own
# settings in migrations/env.py, so there is exactly one place a deployment
# configures its database and no chance of a migration running against a
# different one from the API.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, ordered filenames. A governance system's migration history is
# read by people trying to reconstruct when a rule changed, and an unordered
# directory of hashes makes that harder than it needs to be.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
